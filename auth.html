<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#08090a">
<title>Sign In • VRouter</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #08090a; --bg2: #0f1011;
  --card: #191a1b; --card2: #28282c;
  --border: rgba(124,58,237,0.25); --border-sub: rgba(255,255,255,0.05);
  --text: #f7f8f8; --text2: #d0d6e0; --text3: #8a8f98;
  --accent: #7c3aed; --accent2: #8b5cf6; --teal: #06b7d4; --green: #34d399; --red: #f87171;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font-family: 'Geist', 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  font-feature-settings: "cv01", "ss03"; font-size: 15px; line-height: 1.6;
  -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased;
}
code, .mono { font-family: 'Geist Mono', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
a { color: var(--accent2); text-decoration: none; }
a:hover { text-decoration: underline; }

.auth-wrap {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: linear-gradient(180deg, rgba(124,58,237,0.05) 0%, rgba(6,183,212,0.03) 100%);
}
.auth-container {
  width: 100%;
  max-width: 360px;
}
.auth-header { text-align: center; margin-bottom: 32px; }
.auth-header .logo { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 20px; font-weight: 700; margin-bottom: 8px; }
.auth-header .logo-icon { font-size: 22px; }
.auth-header h1 { font-size: 22px; font-weight: 700; }
.auth-header p { font-size: 13px; color: var(--text3); margin-top: 6px; }

.auth-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 36px 28px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.4);
}
.auth-card h2 { font-size: 18px; font-weight: 600; margin-bottom: 20px; }
.auth-footer { text-align: center; margin-top: 24px; font-size: 13px; color: var(--text3); }
.auth-footer a { color: var(--accent2); }

.form-group { margin-bottom: 20px; }
.form-label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 8px; color: var(--text2); }
.form-input {
  width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--bg2); color: var(--text); font-size: 15px; outline: none; transition: border-color 0.2s;
}
.form-input:focus { border-color: var(--accent); }
.form-input::placeholder { color: var(--text3); }

.btn {
  width: 100%; padding: 14px; border-radius: 10px; border: none; font-weight: 500;
  font-size: 14px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px;
}
.btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: white; }
.btn-primary:hover { opacity: 0.9; }
.btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
.btn-loading { pointer-events: none; }

.btn-ghost {
  background: transparent; color: var(--text2);
  border: 1px solid var(--border); margin-top: 12px;
}
.btn-ghost:hover { background: rgba(255,255,255,0.05); color: var(--text); }

.divider {
  text-align: center; margin: 20px 0; font-size: 12px; color: var(--text3);
  position: relative;
}
.divider::before {
  content: ""; position: absolute; left: 0; top: 50%; width: 40%; height: 1px; background: var(--border-sub);
}
.divider::after {
  content: ""; position: absolute; right: 0; top: 50%; width: 40%; height: 1px; background: var(--border-sub);
}

.error-msg {
  color: var(--red); font-size: 13px; margin-bottom: 16px; text-align: center;
  background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.3);
  border-radius: 8px; padding: 10px 14px; display: none;
}

.tab-switch { text-align: center; margin-top: 16px; font-size: 13px; }
.tab-switch a { color: var(--accent2); cursor: pointer; }
.tab-switch a:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="auth-wrap">
  <div class="auth-container">
    <div class="auth-header">
      <div class="logo">
        <span class="logo-icon">🧭</span>
        <span class="logo-text">VRouter</span>
      </div>
      <h1>Sign in to your account</h1>
      <p>Enter your email to receive a verification code</p>
    </div>

    <div class="auth-card">
      <div class="error-msg" id="authError"></div>

      <!-- EMAIL STEP -->
      <div id="emailStep">
        <div class="form-group">
          <label class="form-label">Email address</label>
          <input type="email" id="emailInput" class="form-input" placeholder="you@example.com" autocomplete="email">
        </div>
        <button class="btn btn-primary" id="sendOtpBtn" onclick="sendOtp()">
          <span id="sendOtpText">Send Verification Code</span>
          <span id="sendOtpLoading" class="hidden">Sending...</span>
        </button>
      </div>

      <!-- OTP STEP -->
      <div id="otpStep" class="hidden">
        <div class="form-group">
          <label class="form-label">Verification code</label>
          <input type="text" id="otpInput" class="form-input" placeholder="Enter 6-digit code" autocomplete="one-time-code" maxlength="6">
        </div>
        <button class="btn btn-primary" id="verifyOtpBtn" onclick="verifyOtp()">
          <span id="verifyOtpText">Verify & Continue</span>
          <span id="verifyOtpLoading" class="hidden">Verifying...</span>
        </button>
        <div class="tab-switch">
          Didn't receive code? <a onclick="resendOtp()">Resend</a>
        </div>
      </div>
    </div>

    <div class="tab-switch">
      Don't have an account? <a onclick="switchToSignup()">Sign up</a>
    </div>
  </div>
</div>

<script>
const BASE = 'https://vrouter.my.id';
const DASH_BASE = window.location.origin.includes('20129') ? '' : '';
const API_ORIGIN = 'https://vrouter.my.id';

let isSignup = new URLSearchParams(window.location.search).get('signup') === 'true';
let email = '';

function setCookie(name, value) {
  document.cookie = `${name}=${value}; path=/; SameSite=Lax`;
}

function showError(msg) {
  const el = document.getElementById('authError');
  el.textContent = msg;
  el.style.display = 'block';
}
function hideError() {
  document.getElementById('authError').style.display = 'none';
}
function setLoading(btnId, loadingId, textId, state) {
  const btn = document.getElementById(btnId);
  const loading = document.getElementById(loadingId);
  const text = document.getElementById(textId);
  if (state) {
    btn.disabled = true;
    btn.classList.add('btn-loading');
    loading.classList.remove('hidden');
    text.classList.add('hidden');
  } else {
    btn.disabled = false;
    btn.classList.remove('btn-loading');
    loading.classList.add('hidden');
    text.classList.remove('hidden');
  }
}

function switchToSignup() {
  isSignup = true;
  document.querySelector('.auth-header h1').textContent = 'Create your account';
  document.querySelector('.auth-header p').textContent = 'Enter your email to get started';
  const btn = document.getElementById('sendOtpText');
  btn.textContent = 'Send Verification Code';
  window.location.href = '/auth?signup=true';
}

function sendOtp() {
  const emailVal = document.getElementById('emailInput').value;
  if (!emailVal || !emailVal.includes('@')) {
    showError('Please enter a valid email address');
    return;
  }
  hideError();
  setLoading('sendOtpBtn', 'sendOtpLoading', 'sendOtpText', true);

  const endpoint = isSignup ? '/api/signup-request-otp' : '/api/request-otp';
  fetch(API_ORIGIN + endpoint, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: emailVal })
  })
  .then(r => r.json())
  .then(data => {
    setEmail(data);
  })
  .catch(err => {
    showError('Failed to send code. Please try again.');
  })
  .finally(() => {
    setLoading('sendOtpBtn', 'sendOtpLoading', 'sendOtpText', false);
  });
}

function setEmail(data) {
  email = document.getElementById('emailInput').value;
  document.getElementById('emailStep').classList.add('hidden');
  document.getElementById('otpStep').classList.remove('hidden');
  document.getElementById('otpInput').focus();
}

function verifyOtp() {
  const code = document.getElementById('otpInput').value;
  if (!code || code.length < 6) {
    showError('Please enter the verification code');
    return;
  }
  hideError();
  setLoading('verifyOtpBtn', 'verifyOtpLoading', 'verifyOtpText', true);

  fetch(API_ORIGIN + '/api/verify-otp', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: email, code: code })
  })
  .then(r => r.json())
  .then(data => {
    if (data.api_key || data.key) {
      const key = data.api_key || data.key;
      setCookie('vrouter_key', key);
      setCookie('vrouter_email', email);
      // Show API key to user
      alert('Your API key has been generated!\n\n' + key + '\n\nSave this key securely.');
      // Redirect to dashboard
      window.location.href = '/';
    } else if (data.error) {
      showError(data.error || 'Verification failed');
    } else {
      // Admin login path
      if (data.dashboard) {
        window.location.href = '/dashboard';
      } else {
        alert('Login successful!');
        window.location.href = '/';
      }
    }
  })
  .catch(err => {
    showError('Verification failed. Please try again.');
  })
  .finally(() => {
    setLoading('verifyOtpBtn', 'verifyOtpLoading', 'verifyOtpText', false);
  });
}

function resendOtp() {
  const emailVal = document.getElementById('emailInput').value;
  if (!emailVal) {
    showError('Please enter your email first');
    return;
  }
  setLoading('sendOtpBtn', 'sendOtpLoading', 'sendOtpText', true);

  const endpoint = isSignup ? '/api/signup-request-otp' : '/api/request-otp';
  fetch(API_ORIGIN + endpoint, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: emailVal, resend: true })
  })
  .then(r => r.json())
  .then(() => {
    alert('Code resent! Check your email.');
  })
  .catch(() => {
    showError('Failed to resend code');
  })
  .finally(() => {
    setLoading('sendOtpBtn', 'sendOtpLoading', 'sendOtpText', false);
  });
}

if (isSignup) {
  document.querySelector('.auth-header h1').textContent = 'Create your account';
  document.querySelector('.auth-header p').textContent = 'Enter your email to get started';
}
</script>

</body>
</html>
